[project]
name = "performance-recast"
version = "0.1.0"
description = "Recast a performance onto any character with open-weight Wan Animate-2, run through the Comfy SDK."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "comfy-sdk==0.5.0",
  "mediapipe==0.10.21",  # face detection for the character crop (CPU, bundled model)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
server = ["fastapi==0.118.0", "uvicorn==0.37.0", "python-multipart==0.0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
