# Inner nginx: the static app plus /api to the backend. Basic auth lives here, not in the edge
# proxy, so changing a password never touches the machine's shared gateway.
server {
    listen 80;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=10s;          # Docker's DNS: the backend may restart under a new IP
    set $recast_api recast-api;

    auth_basic "Recast";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 95m;              # recast.media.MAX_UPLOAD_BYTES is 90 MB

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://$recast_api:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
